<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rani Cake Nepalgunj – Orders</title>
<style>
  body{font-family:Arial,sans-serif;background:#fff7f9;color:#4a2c2a;padding:30px}
  h1{color:#c2185b;margin-bottom:6px}
  a{color:#e75480}
  .wrap{overflow-x:auto;margin-top:20px}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.08)}
  th,td{padding:12px;text-align:left;border-bottom:1px solid #f3d3dc}
  th{background:#e75480;color:#fff}
</style>
</head>
<body>
<h1>📋 रानी केक नेपालगञ्ज – Customer Orders</h1>
<a href="index.html">← Back to website</a>
<div class="wrap">
<table>
  <thead><tr><th>#</th><th>Customer</th><th>Phone</th><th>Cake</th><th>Qty</th><th>Total</th><th>Message</th><th>Time</th></tr></thead>
  <tbody id="rows"><tr><td colspan="8">Loading...</td></tr></tbody>
</table>
</div>
<script>
fetch('/api/orders').then(r => r.json()).then(list => {
  document.getElementById('rows').innerHTML = list.length ? list.map(o => `
    <tr><td>${o.id}</td><td>${o.customer_name}</td><td>${o.phone}</td><td>${o.cake}</td>
    <td>${o.quantity}</td><td>रु ${o.total}</td><td>${o.message || '-'}</td>
    <td>${new Date(o.created_at+'Z').toLocaleString('en-GB',{timeZone:'Asia/Kathmandu'})}</td></tr>`).join('')
    : '<tr><td colspan="8">No orders yet.</td></tr>';
});
</script>
</body>
</html>
